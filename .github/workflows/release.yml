# Publishing a GitHub release tagged vX.Y.Z:
#  - builds module.zip from module/ and attaches it with a module.json whose
#    version and download URL match the tag. Foundry installs and updates from
#    https://github.com/hsergelstringer/foundryvtt-player-companion/releases/latest/download/module.json
#  - builds the relay server image and pushes it to
#    ghcr.io/hsergelstringer/foundryvtt-player-companion:<version> and :latest
name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  packages: write

jobs:
  module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version and download URL into module.json
        working-directory: module
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          jq --arg v "${TAG#v}" \
             --arg d "https://github.com/$REPO/releases/download/$TAG/module.zip" \
             '.version = $v | .download = $d' module.json > module.tmp.json
          mv module.tmp.json module.json

      - name: Build module.zip
        working-directory: module
        run: zip -r ../module.zip module.json scripts templates styles

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" module/module.json module.zip --clobber

  server-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "tags=$IMAGE:${TAG#v},$IMAGE:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
